[package]
name = "proto-tool"
version = "0.2.0"
description = "给任意 HTML 原型贴便利贴，备注直接烧进文件"
authors = ["KUNER66"]
license = "MIT"
edition = "2021"
rust-version = "1.77"
repository = "https://github.com/KUNER66/proto-tool"
readme = "../README.md"

[lib]
name = "proto_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
