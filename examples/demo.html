<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>测试原型 · 列车运行图</title>
<style>
  body{font:14px/1.7 "Microsoft YaHei",sans-serif;margin:0;background:#f5f7fa;color:#1f2329;}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px 120px;}
  h1{font-size:20px;margin:0 0 6px;}
  .sub{color:#86909c;margin-bottom:28px;}
  .card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:20px;margin-bottom:16px;}
  .card h2{font-size:15px;margin:0 0 10px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid #e5e6eb;padding:8px 10px;text-align:left;}
  th{background:#f7f8fa;font-weight:500;}
</style>
</head>
<body>
<div class="wrap">
  <h1>列车运行图编制 · 测试原型</h1>
  <div class="sub">这是一份用于验证备注工具的普通 HTML，与 DCC 项目无关。</div>

  <div class="card">
    <h2>一、基础信息</h2>
    <table>
      <tr><th>线路</th><th>方向</th><th>首班车</th><th>末班车</th></tr>
      <tr><td>5 号线</td><td>上行</td><td>06:00</td><td>23:00</td></tr>
      <tr><td>5 号线</td><td>下行</td><td>06:12</td><td>23:12</td></tr>
    </table>
  </div>

  <div class="card">
    <h2>二、交路方案</h2>
    <p>本方案采用大小交路套跑，高峰时段最小行车间隔 180 秒。</p>
  </div>

  <div class="card">
    <h2>三、待确认事项</h2>
    <p>折返时间是否可压缩至 120 秒，需与乘务组复核。</p>
  </div>
</div>

</body>
</html>
