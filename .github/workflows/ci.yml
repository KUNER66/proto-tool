name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Unit tests (injection core)
        run: node test/injector.test.js

      - name: Start server in background
        shell: bash
        run: |
          node src/server.js --port 7318 > server.log 2>&1 &
          node -e '
            const http = require("http");
            const deadline = Date.now() + 20000;
            (function poll() {
              const req = http.get({host:"127.0.0.1",port:7318,path:"/api/ping"}, res => {
                res.resume();
                if (res.statusCode === 200) { console.log("server is up"); process.exit(0); }
                retry();
              });
              req.on("error", retry);
              function retry() {
                if (Date.now() > deadline) {
                  console.error("server failed to start");
                  require("fs").readFileSync("server.log","utf8").split("\n").forEach(l => console.error(l));
                  process.exit(1);
                }
                setTimeout(poll, 300);
              }
            })();
          '

      - name: End-to-end tests (local server)
        env:
          PORT_TEST: '7318'
        run: node test/server.e2e.js

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.os }}-${{ matrix.node }}
          path: server.log
          if-no-files-found: ignore
